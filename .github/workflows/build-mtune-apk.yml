name: Build MTune APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed MTune APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            ver="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            tag="v${ver}"
            if gh release view "$tag" >/dev/null 2>&1; then
              tag="v${ver}-b${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load Permanent Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.MTUNE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MTUNE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_ENV: ${{ secrets.MTUNE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MTUNE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Permanent MTUNE_KEYSTORE_BASE64 secret is missing! Refusing to sign with an ephemeral key so updates never break."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mtune-release.keystore"
          echo "MTUNE_KEYSTORE=$RUNNER_TEMP/mtune-release.keystore" >> "$GITHUB_ENV"
          echo "MTUNE_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "MTUNE_KEY_ALIAS=$KEY_ALIAS_ENV" >> "$GITHUB_ENV"
          echo "MTUNE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build MTune Mobile & TV Release APKs
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID || secrets.DISCORD_APP_ID }}
        run: ./gradlew --no-daemon :app:assembleRelease :tv:assembleRelease

      - name: Package & Hash MTune APKs
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/MTune-${TAG}-${abi}.apk"
          done
          if [ -f tv/build/outputs/apk/release/tv-release.apk ]; then
            cp tv/build/outputs/apk/release/tv-release.apk "dist/MTune-TV-${TAG}.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload MTune APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MTune-APKs-${{ steps.ver.outputs.tag }}
          path: dist/

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MTune ${{ steps.ver.outputs.tag }}
          files: dist/*
          generate_release_notes: true

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mtune-release.keystore"
