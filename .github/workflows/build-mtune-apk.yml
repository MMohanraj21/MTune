name: Build MTune APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed MTune APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.MTUNE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MTUNE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_ENV: ${{ secrets.MTUNE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MTUNE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mtune-release.keystore"
            echo "MTUNE_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "MTUNE_KEY_ALIAS=$KEY_ALIAS_ENV" >> "$GITHUB_ENV"
            echo "MTUNE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/mtune-release.keystore" \
              -storepass mtune-release-pass \
              -keypass mtune-release-pass \
              -alias mtune \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MTune, OU=Mobile, O=MTune, L=Local, S=Local, C=US"
            echo "MTUNE_KEYSTORE_PASSWORD=mtune-release-pass" >> "$GITHUB_ENV"
            echo "MTUNE_KEY_ALIAS=mtune" >> "$GITHUB_ENV"
            echo "MTUNE_KEY_PASSWORD=mtune-release-pass" >> "$GITHUB_ENV"
          fi
          echo "MTUNE_KEYSTORE=$RUNNER_TEMP/mtune-release.keystore" >> "$GITHUB_ENV"

      - name: Build MTune Mobile & TV Release APKs
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID || secrets.DISCORD_APP_ID }}
        run: ./gradlew --no-daemon :app:assembleRelease :tv:assembleRelease

      - name: Package & Hash MTune APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/MTune-${abi}.apk"
          done
          if [ -f tv/build/outputs/apk/release/tv-release.apk ]; then
            cp tv/build/outputs/apk/release/tv-release.apk "dist/MTune-TV.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload MTune APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MTune-APKs
          path: dist/

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.1.0-mtune-{0}', github.run_number) }}
          name: MTune ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.1.0 (Build {0})', github.run_number) }}
          files: dist/*
          generate_release_notes: true

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mtune-release.keystore"
